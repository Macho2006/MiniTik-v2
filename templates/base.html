<!DOCTYPE html>
<html>
<head>
    <title>MiniTik</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: Arial; background: #000; color: #fff; margin: 0; padding: 20px; }
        a { color: #00f5d4; text-decoration: none; }
        nav { background: #111; padding: 10px; margin-bottom: 20px; }
        nav a { margin-right: 15px; }
        .flash { background: #00f5d4; color: #000; padding: 10px; margin: 10px 0; border-radius: 5px; }
        button { background: #00f5d4; color: #000; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
        input { padding: 8px; border-radius: 5px; border: none; }
    </style>
</head>
<body>
    <nav>
        <a href="/">Home</a>
        <a href="/upload">Upload</a>
        <a href="/trending">Trending</a>
        <a href="/search">Search</a>
        <a href="/dm_inbox">DM</a>
        <a href="/following">Following</a>
        <a href="/notifications">Notifications</a>
        <a href="/profile/{{current_user.username}}">Profile</a>
        {% if current_user.is_admin %}<a href="/admin">Admin</a>{% endif %}
        <a href="/logout">Logout</a>
    </nav>
    
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="flash">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
</body>
</html>
