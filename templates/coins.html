{% extends "base.html" %}
{% block title %}Buy Coins | MiniTik{% endblock %}
{% block content %}
<div style="padding:20px;max-width:500px;margin:auto">
    <h2 style="text-align:center">🪙 Buy Coins</h2>
    <div style="background:#111;padding:15px;border-radius:12px;text-align:center;margin:20px 0">
        <b style="font-size:28px">{{ balance }}</b><br><span style="color:#888">Your Balance</span>
    </div>
    <p style="text-align:center;color:orange">DEMO MODE: No real payment. Coins added instantly</p>

    <form method="POST" action="/buy_coins">
        <div style="display:grid;gap:10px">
            <button name="coins" value="100" style="background:#222;padding:15px;border-radius:10px;border:none;color:#fff">100 Coins - ₦1000 / $1.00</button>
            <button name="coins" value="500" style="background:#222;padding:15px;border-radius:10px;border:none;color:#fff">500 Coins - ₦4500 / $4.50</button>
            <button name="coins" value="1000" style="background:#222;padding:15px;border-radius:10px;border:none;color:#fff">1000 Coins - ₦8000 / $8.00</button>
        </div>
    </form>
</div>
{% endblock %}
