{% extends "base.html" %}
{% block content %}
<style>
.chat-container{max-width:600px;margin:0 auto;height:80vh;display:flex;flex-direction:column}
.chat-header{padding:15px;border-bottom:1px solid #222;text-align:center;font-weight:bold}
.chat-box{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:70%;padding:10px 14px;border-radius:18px}
.msg.me{align-self:flex-end;background:#ff0050;color:#fff}
.msg.them{align-self:flex-start;background:#222}
.chat-input{display:flex;padding:10px;border-top:1px solid #222}
.chat-input input{flex:1;background:#222;border:none;border-radius:20px;padding:12px;color:#fff}
.chat-input button{background:#ff0050;border:none;border-radius:50%;width:45px;height:45px;margin-left:10px;color:#fff;font-size:20px}
</style>

<div class="chat-container">
    <div class="chat-header">Chat with {{friend}}</div>
    <div class="chat-box" id="chat-box">
        {% for m in messages %}
        <div class="msg {{ 'me' if m.sender==current_user.username else 'them' }}" data-id="{{m.id}}">
            {{m.message}}
        </div>
        {% endfor %}
    </div>
    <form class="chat-input" id="chat-form">
        <input type="text" id="message-input" placeholder="Message..." autocomplete="off">
        <button type="submit">➤</button>
    </form>
</div>

<script>
const chatBox = document.getElementById('chat-box');
const friend = "{{friend}}";
let lastId = Math.max(0, ...Array.from(document.querySelectorAll('.msg')).map(m=>parseInt(m.dataset.id)||0));

function scrollToBottom(){ chatBox.scrollTop = chatBox.scrollHeight; }
scrollToBottom();

// SEND MESSAGE
document.getElementById('chat-form').onsubmit = async (e) => {
    e.preventDefault();
    const input = document.getElementById('message-input');
    const msg = input.value.trim();
    if(!msg) return;
    input.value = '';
    await fetch(`/dm_send/${friend}`, {method:'POST', body:new FormData(document.getElementById('chat-form'))});
    // We will get it on next poll
}

// CHECK FOR NEW MESSAGES EVERY 2 SECONDS
setInterval(async () => {
    const res = await fetch(`/dm_get/${friend}?last_id=${lastId}`);
    const newMsgs = await res.json();
    newMsgs.forEach(m => {
        lastId = Math.max(lastId, m.id);
        const div = document.createElement('div');
        div.className = 'msg ' + (m.sender == "{{current_user.username}}" ? 'me' : 'them');
        div.dataset.id = m.id;
        div.innerText = m.message;
        chatBox.appendChild(div);
    });
    if(newMsgs.length > 0) scrollToBottom();
}, 2000);
</script>
{% endblock %}
