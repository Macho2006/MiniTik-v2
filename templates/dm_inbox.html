{% extends "base.html" %}
{% block content %}
<style>
.chat-list{padding:20px;max-width:700px;margin:0 auto}
.header-title{color:#ff0050;margin:20px 0;font-size:26px;text-align:center}
.chat-item{background:#111;padding:15px;margin:10px 0;border-radius:12px;display:flex;align-items:center;border:1px solid #222;transition:0.2s}
.chat-item:hover{background:#1a1a1a;border-color:#ff0050}
.chat-item a{color:#fff;text-decoration:none;font-size:18px;font-weight:bold}
.avatar{width:50px;height:50px;border-radius:50%;background:#ff0050;margin-right:15px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#000;font-weight:bold}
.empty{text-align:center;margin-top:100px;color:#888}
.empty a{color:#ff0050}
</style>

<h2 class="header-title">💬 Messages</h2>

<div class="chat-list">
{% if chats %}
    {% for c in chats %}
    <div class="chat-item">
        <div class="avatar">{{ c['user'][0]|upper }}</div>
        <a href="/dm_chat/{{ c['user'] }}">@{{ c['user'] }}</a>
    </div>
    {% endfor %}
{% else %}
    <div class="empty">
        <h3>No messages yet</h3>
        <p>Go to <a href="/friends">Discover</a> and start a chat</p>
    </div>
{% endif %}
</div>
{% endblock %}
