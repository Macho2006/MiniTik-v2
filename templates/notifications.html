<!DOCTYPE html>
<html>
<head>
<title>Notifications - MiniTik</title>
<style>
body{background:#000;color:white;font-family:Arial;padding:20px}
a{color:#ff0050;text-decoration:none}
.notif{background:#121212;padding:15px;margin:10px 0;border-radius:10px;border-left:3px solid #ff0050;display:flex;align-items:center;gap:12px}
.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover}
.username{font-weight:bold;color:#ff0050}
.time{font-size:12px;color:#888}
.unread{border-left:3px solid #00f2ea}
</style>
</head>
<body>
<a href="/">← Back</a>
<h1>Notifications 🔔</h1>

{% if notifications %}
  {% for n in notifications %}
  <div class="notif {% if not n.is_read %}unread{% endif %}">
    <img src="{{ n.profile_pic }}" class="avatar">
    <div>
      <span class="username">{{ n.actor }}</span> {{ n.message }}
      <div class="time">{{ n.timestamp | int | ctime }}</div>
    </div>
  </div>
  {% endfor %}
{% else %}
  <p>No notifications yet</p>
{% endif %}

</body>
</html>
