{% extends "base.html" %}
{% block content %}
<style>
.notif-list{max-width:700px;margin:0 auto}
.page-title{color:#ff0050;margin-bottom:20px}
.notif{background:#121212;padding:15px;margin:10px 0;border-radius:10px;border-left:3px solid #ff0050;display:flex;align-items:center;gap:12px;transition:0.2s}
.notif:hover{background:#1a1a1a}
.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#222}
.username{font-weight:bold;color:#ff0050}
.time{font-size:12px;color:#888}
.unread{border-left:3px solid #00f2ea;background:#0f1a1a}
.empty{text-align:center;color:#888;margin-top:100px}
</style>

<div class="notif-list">
    <h1 class="page-title">Notifications 🔔</h1>

{% if notifications %}
  {% for n in notifications %}
  <a href="{{ n.link if n.link else '#' }}" style="text-decoration:none;color:white">
    <div class="notif {% if not n.is_read %}unread{% endif %}">
        <img src="{{ n.profile_pic if n.profile_pic else '/static/default.jpg' }}" class="avatar">
        <div>
            <span class="username">@{{ n.actor }}</span> {{ n.message }}
            <div class="time">{{ n.timestamp }}</div>
        </div>
    </div>
  </a>
  {% endfor %}
{% else %}
  <div class="empty">
      <h3>No notifications yet</h3>
      <p>When someone likes or comments, you'll see it here</p>
  </div>
{% endif %}
</div>
{% endblock %}
