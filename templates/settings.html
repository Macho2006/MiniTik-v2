<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings - MiniTik</title>
<style>
*{margin:0; padding:0; box-sizing:border-box}
body{background:#000; color:white; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial; padding:20px}
.box{background:#111; max-width:500px; margin:40px auto; padding:30px; border-radius:15px; text-align:center}
.avatar{width:120px; height:120px; border-radius:50%; object-fit:cover; margin-bottom:15px; border:3px solid #ff0050}
input, textarea{padding:12px; width:90%; border-radius:10px; border:none; background:#222; color:white; margin:8px 0; font-size:15px}
button{padding:12px 25px; border-radius:10px; border:none; background:#ff0050; color:white; font-weight:bold; cursor:pointer; margin-top:10px; width:90%}
button:hover{background:#e6004c}
a{color:#00f2ea; text-decoration:none; display:block; margin-top:15px}
label{font-size:14px; color:#aaa; display:block; text-align:left; margin-left:5%}
</style>
</head>
<body>
<div class="box">
    <h2>⚙️ Settings</h2>
    <p style="color:#888; margin-bottom:20px">Update your profile</p>

    <!-- CURRENT PFP -->
    <img src="{{ session.profile_pic }}" class="avatar">

    <!-- FORM 1: UPLOAD PFP -->
    <form method="POST" enctype="multipart/form-data">
        <label>Change Profile Picture</label>
        <input type="file" name="profile_pic" accept="image/*" required>
        <button type="submit">Upload PFP</button>
    </form>

    <hr style="border:1px solid #222; margin:25px 0">

    <!-- FORM 2: UPDATE USERNAME + BIO -->
    <form method="POST" action="/update_profile">
        <label>Username</label>
        <input name="username" value="{{ user.username }}" required>
        
        <label>Bio</label>
        <textarea name="bio" placeholder="Write bio..." rows="3">{{ user.bio }}</textarea>
        
        <button type="submit">Save Changes</button>
    </form>

    <a href="/">← Back to Home</a>
</div>
</body>
</html>
