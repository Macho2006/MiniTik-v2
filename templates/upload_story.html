<!DOCTYPE html>
<html>
<head><title>Upload Story</title>
<style>body{background:#000;color:#fff;font-family:Arial;text-align:center;padding-top:100px}</style>
</head>
<body>
<h2>📸 Post Story - 24 Hours</h2>
<form method=post enctype=multipart/form-data>
<input type=file name=story accept="video/*,image/*" required style="color:#fff"><br><br>
<button style="padding:12px 30px;background:#ff0050;color:#fff;border:0;border-radius:8px;font-size:16px">Post Story</button>
</form>
<br><a href="/" style="color:#888">Cancel</a>
</body>
</html>
