<!DOCTYPE html><html><head><title>Story</title><style>body{background:#000;margin:0}</style></head><body>
{% if story %}<video src="{{ story.video }}" autoplay style="width:100%;height:100vh;object-fit:contain"></video>
<div style="position:absolute;top:20px;left:20px;display:flex;align-items:center;gap:10px;color:#fff">
<img src="{{ story.profile_pic }}" style="width:40px;height:40px;border-radius:50%"><b>{{ story.username }}</b></div>{% endif %}
<a href="/" style="position:absolute;top:20px;right:20px;color:#fff;font-size:30px">X</a></body></html>
