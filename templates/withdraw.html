{% extends "base.html" %}
{% block title %}Withdraw | MiniTik{% endblock %}
{% block content %}
<div style="padding:20px;max-width:500px;margin:auto">
    <h2 style="text-align:center">💰 Withdraw Earnings</h2>
    <div style="background:#111;padding:15px;border-radius:12px;text-align:center;margin:20px 0">
        <b style="font-size:28px">${{ total_earnings }}</b><br><span style="color:#888">Available This Month</span>
    </div>
    <p style="text-align:center;color:orange">Minimum $10. Paid manually until BVN is ready</p>

    <form method="POST">
        <input type="number" step="0.01" name="amount" placeholder="Amount in USD" required style="width:100%;padding:12px;background:#222;border:1px solid #333;border-radius:8px;color:#fff;margin:10px 0">
        
        <select name="method" required style="width:100%;padding:12px;background:#222;border:1px solid #333;border-radius:8px;color:#fff;margin:10px 0">
            <option value="bank">Bank Transfer - Nigeria Only</option>
            <option value="usdt">USDT - Worldwide</option>
        </select>

        <input type="text" name="bank" placeholder="Bank Name | Account Number | Account Name" style="width:100%;padding:12px;background:#222;border:1px solid #333;border-radius:8px;color:#fff;margin:10px 0">
        <input type="text" name="usdt" placeholder="USDT TRC20 Wallet Address" style="width:100%;padding:12px;background:#222;border:1px solid #333;border-radius:8px;color:#fff;margin:10px 0">

        <button type="submit" style="background:#fe2c55;padding:12px;width:100%;border:none;border-radius:8px;color:#fff;font-weight:bold">Request Withdrawal</button>
    </form>
</div>
{% endblock %}
